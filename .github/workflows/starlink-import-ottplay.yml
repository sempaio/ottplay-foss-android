name: Import OTT-play history
on:
  push:
    branches:
      - starlink/import-ottplay-foss
    paths:
      - .github/workflows/starlink-import-ottplay.yml

permissions:
  contents: write

concurrency:
  group: starlink-one-time-upstream-import
  cancel-in-progress: false

jobs:
  import-history:
    if: github.repository == 'sempaio/ottplay-foss-android' && github.ref == 'refs/heads/starlink/import-ottplay-foss'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preserve the complete pinned upstream history
        shell: bash
        env:
          IMPORT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='starlink/import-ottplay-foss'
          upstream_commit='8fd8ef96837e5fbc9d3206938ea5f0d33c52ea75'
          upstream_tree='4b9444942faeb5def358d8fbe3ed35a1963f2b17'
          original_main='9d3b859a67e1d325735ffd09fd59181a14a32324'
          mkdir -p "$RUNNER_TEMP/starlink-source-import"
          cd "$RUNNER_TEMP/starlink-source-import"
          git init --quiet
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git remote add upstream 'https://github.com/open-ott-play/ottplay-foss.git'
          auth="$(printf 'x-access-token:%s' "$IMPORT_GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin \
            "refs/heads/$branch:refs/remotes/origin/import" \
            'refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "$original_main"
          test "$(git rev-parse refs/remotes/origin/import)" = "$GITHUB_SHA"
          git fetch --no-tags upstream 'refs/heads/main:refs/remotes/upstream/main'
          test "$(git rev-parse "$upstream_commit^{tree}")" = "$upstream_tree"
          test "$(git rev-parse --is-shallow-repository)" = 'false'
          git fsck --full
          git config user.name 'Codex'
          git config user.email 'codex@openai.com'
          bridge_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          bridge="$(printf '%s\n' \
            'Preserve complete OTT-play upstream history for the import' \
            '' \
            'Upstream: https://github.com/open-ott-play/ottplay-foss' \
            "Upstream commit: $upstream_commit" \
            "Upstream tree: $upstream_tree" \
            '' \
            'This transfer commit keeps the preparation tree unchanged.' \
            'The next import commit will select the exact upstream source tree.' \
            'The destination main branch is not modified.' \
            | git commit-tree "$bridge_tree" -p "$GITHUB_SHA" -p "$upstream_commit")"
          git diff --exit-code "$GITHUB_SHA" "$bridge"
          git merge-base --is-ancestor "$upstream_commit" "$bridge"
          git merge-base --is-ancestor "$original_main" "$bridge"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin \
            "$bridge:refs/heads/$branch"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$original_main"
          printf 'History transfer commit: %s\nUpstream commit: %s\n' "$bridge" "$upstream_commit"
          printf 'Upstream commits retained: %s\n' "$(git rev-list --count "$upstream_commit")"
          printf 'History transfer: %s\nPinned upstream: %s\nMain preserved: %s\n' \
            "$bridge" "$upstream_commit" "$original_main" >> "$GITHUB_STEP_SUMMARY"
