name: STARLINK M81 Android installable QA build

on:
  push:
    branches: [feature/starlink-qa91-proxima-atualizacao-20261117, feature/starlink-everycine-fluxo-visual-20261117, fix/starlink-everycine-live-recovery-20261120]
    paths:
      - 'native/**'
      - '.github/workflows/starlink-m81-qa-installable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-qa:
    name: Test and build isolated STARLINK APK
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: Compile and run core and Android tests
        working-directory: native
        run: ./gradlew --no-daemon --max-workers=2 --stacktrace :core:test :app:testLayoutUnitTest :app:assembleEveryCineQa
      - name: Validate independent APK and generate receipt
        run: |
          set -euo pipefail
          APK=native/app/build/outputs/apk/everyCineQa/app-everyCineQa.apk
          test -s "$APK"
          unzip -tqq "$APK" # Confere a integridade ZIP antes de disponibilizar o APK
          mkdir -p qa-install
          cp "$APK" qa-install/STARLINK-EVERYCINE-VISUAL-TESTE.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose qa-install/STARLINK-EVERYCINE-VISUAL-TESTE.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging qa-install/STARLINK-EVERYCINE-VISUAL-TESTE.apk | grep -F "package: name='br.starlink.iptv.everycineqa'"
          sha256sum qa-install/STARLINK-EVERYCINE-VISUAL-TESTE.apk | tee qa-install/SHA256SUMS.txt
          printf 'STARLINK Android Every Cine — candidato de teste\nCommit: %s\nPacote: br.starlink.iptv.everycineqa\nBase: QA8 + fluxo visual Every Cine no codigo Android da PR 33\nNao substitui a QA9.1: instala separadamente\nCompilacao e testes automatizados nao comprovam video em movimento\nValidar reproducao real no aparelho antes de qualquer promocao\n' "$GITHUB_SHA" > qa-install/LEIA-ANTES.txt
      - name: Upload test APK only (never publish official release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: STARLINK-EVERYCINE-VISUAL-TESTE
          path: qa-install/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: STARLINK-M81-ANDROID-TEST-REPORTS
          path: |
            native/core/build/test-results/
            native/app/build/test-results/
            native/core/build/reports/tests/
            native/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
