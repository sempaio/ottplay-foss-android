name: STARLINK - layout artwork origins
on:
  push:
    branches: [starlink/origens-capas-layout-20261029]
    paths:
      - 'native/**'
      - '.github/workflows/starlink-artwork-origins-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artwork-origins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: Test real cache origins, redirects and HTTP 304; lint and build
        working-directory: native
        run: ./gradlew --no-daemon --stacktrace :core:test :app:testOriginsTestUnitTest :app:lintOriginsTest :app:assembleOriginsTest
      - name: Verify separate APK and checksum
        run: |
          set -euo pipefail
          mkdir -p candidate
          cp native/app/build/outputs/apk/originsTest/app-originsTest.apk candidate/STARLINK-IPTV-ORIGENS-LAYOUT-TESTE.apk
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify candidate/STARLINK-IPTV-ORIGENS-LAYOUT-TESTE.apk
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging candidate/STARLINK-IPTV-ORIGENS-LAYOUT-TESTE.apk | grep -F "package: name='br.starlink.iptv.origins'"
          cd candidate
          sha256sum STARLINK-IPTV-ORIGENS-LAYOUT-TESTE.apk > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: STARLINK-IPTV-ORIGENS-LAYOUT-TESTE
          path: candidate/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: STARLINK-ORIGENS-TEST-REPORTS
          path: |
            native/core/build/reports/tests/
            native/app/build/reports/tests/
            native/app/build/reports/lint-results-*
          if-no-files-found: warn
          retention-days: 7
