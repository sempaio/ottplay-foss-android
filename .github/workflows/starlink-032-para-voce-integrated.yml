name: STARLINK 0.3.2 Para Voce integrated
on:
  push:
    branches: [starlink/032-para-voce-player-fixes-20261030]
    paths:
      - 'native/**'
      - '.github/workflows/starlink-032-para-voce-integrated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: Run core and app tests, lint and build isolated test APK
        working-directory: native
        run: ./gradlew --no-daemon --stacktrace :core:test :app:testLayoutUnitTest :app:lintLayout :app:assembleParaVoceTest
      - name: Validate APK and record checksum
        run: |
          set -euo pipefail
          mkdir -p release-candidate
          cp native/app/build/outputs/apk/paraVoceTest/app-paraVoceTest.apk release-candidate/STARLINK-032-PARA-VOCE-INTEGRADO.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify release-candidate/STARLINK-PARA-VOCE-TESTE.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging release-candidate/STARLINK-PARA-VOCE-TESTE.apk | grep -F "package: name='br.starlink.iptv.paravoce'"
          sha256sum release-candidate/STARLINK-PARA-VOCE-TESTE.apk | tee release-candidate/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: STARLINK-032-PARA-VOCE-INTEGRADO
          path: release-candidate/
          if-no-files-found: error
          retention-days: 30
