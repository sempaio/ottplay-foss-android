name: STARLINK - VOD performance candidate
on:
  push:
    branches: [starlink/vod-performance-20261025]
    paths:
      - 'native/**'
      - '.github/workflows/starlink-vod-performance-20261025.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: Test Xtream resolution, UI and assemble isolated APK
        working-directory: native
        run: ./gradlew --no-daemon --stacktrace :core:test :app:testLayoutUnitTest :app:lintSeriesTest :app:assembleSeriesTest
      - name: Verify isolated APK and checksum
        run: |
          set -euo pipefail
          mkdir -p candidate
          cp native/app/build/outputs/apk/seriesTest/app-seriesTest.apk candidate/STARLINK-IPTV-PERFORMANCE-TESTE.apk
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify candidate/STARLINK-IPTV-PERFORMANCE-TESTE.apk
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging candidate/STARLINK-IPTV-PERFORMANCE-TESTE.apk | grep -F "package: name='br.starlink.iptv.series'"
          cd candidate
          sha256sum STARLINK-IPTV-PERFORMANCE-TESTE.apk > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: STARLINK-IPTV-PERFORMANCE-TESTE
          path: candidate/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: STARLINK-PERFORMANCE-TEST-REPORTS
          path: |
            native/core/build/reports/tests/
            native/app/build/reports/tests/
            native/app/build/reports/lint-results-*
          if-no-files-found: warn
          retention-days: 7
