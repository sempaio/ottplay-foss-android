name: STARLINK 0.3.2 official clean-install candidate (no automatic release)
on:
  push:
    branches: [release/starlink-032-official-clean-install-20261031]
    paths:
      - 'native/**'
      - '.github/workflows/starlink-032-official-clean-install.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-official:
    name: Validate customer build (unsigned; not distributed)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: Test and compile locked customer release variant
        working-directory: native
        run: ./gradlew --no-daemon --max-workers=2 --stacktrace :core:test :app:testLayoutUnitTest :app:lintOfficial :app:assembleOfficial
      - name: Validate official package and non-debuggable manifest (no APK published)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(native/app/build/outputs/apk/official/*.apk)
          test "${#files[@]}" -eq 1
          APK="${files[0]}"
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
          grep -F "package: name='br.starlink.iptv'" <<< "$BADGING"
          grep -F "application-label:'STARLINK IPTV'" <<< "$BADGING"
          if grep -q '^application-debuggable' <<< "$BADGING"; then
            echo "::error::Official APK must not be debuggable"
            exit 1
          fi
          echo "Unsigned qualification passed. This APK must never be distributed."

  signed-candidate:
    name: Sign and audit official clean-install candidate (requires stable secrets)
    needs: qualify-official
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: Require permanent official signing credentials (fail closed)
        env:
          KEYSTORE_B64: ${{ secrets.STARLINK_OFFICIAL_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.STARLINK_OFFICIAL_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STARLINK_OFFICIAL_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.STARLINK_OFFICIAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASS" || -z "$KEY_ALIAS" || -z "$KEY_PASS" ]]; then
            echo "::error title=Official signing unavailable::Four stable signing secrets are required. No debug, unsigned or old APK can replace the official candidate."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/starlink-official.jks"
          chmod 600 "$RUNNER_TEMP/starlink-official.jks"
          test -s "$RUNNER_TEMP/starlink-official.jks"
      - name: Build signed customer APK from this commit
        working-directory: native
        env:
          OTTPLAY_SIGNING_VARIANT: release
          OTTPLAY_KEYSTORE: ${{ runner.temp }}/starlink-official.jks
          OTTPLAY_STORE_PASSWORD: ${{ secrets.STARLINK_OFFICIAL_STORE_PASSWORD }}
          OTTPLAY_KEY_ALIAS: ${{ secrets.STARLINK_OFFICIAL_KEY_ALIAS }}
          OTTPLAY_KEY_PASSWORD: ${{ secrets.STARLINK_OFFICIAL_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --max-workers=2 --stacktrace :core:test :app:testLayoutUnitTest :app:lintOfficial :app:assembleOfficial
      - name: Verify APK signing, package and release security; preserve proof
        run: |
          set -euo pipefail
          APK=native/app/build/outputs/apk/official/app-official.apk
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$APK"
          "$SIGNER" verify --verbose "$APK"
          CERT=$("$SIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test -n "$CERT"
          BADGING=$("$AAPT" dump badging "$APK")
          grep -F "package: name='br.starlink.iptv'" <<< "$BADGING"
          grep -F "application-label:'STARLINK IPTV'" <<< "$BADGING"
          if grep -q '^application-debuggable' <<< "$BADGING"; then
            echo "::error::Signed official build must not be debuggable"
            exit 1
          fi
          mkdir -p release-candidate
          cp "$APK" release-candidate/STARLINK-IPTV-032-OFFICIAL-CLEAN-INSTALL-CANDIDATE.apk
          sha256sum release-candidate/*.apk > release-candidate/SHA256SUMS
          printf 'Commit: %s\nPackage: br.starlink.iptv\nCertificate SHA256: %s\nInstall: clean install; existing app data are NOT migrated\nRelease status: CANDIDATE ONLY; do not publish or install automatically\n' "$GITHUB_SHA" "$CERT" > release-candidate/BUILD-RECEIPT.txt
      - name: Upload only signed candidate for manual review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: STARLINK-032-OFFICIAL-SIGNED-CANDIDATE
          path: release-candidate/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/starlink-official.jks"
