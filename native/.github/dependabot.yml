version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep the qualified networking version until the next transport review.
    ignore:
      - dependency-name: com.squareup.okhttp3:*
        versions: ["5.5.0"]
    groups:
      android-media3:
        patterns:
          - androidx.media3:*
      kotlin:
        patterns:
          - org.jetbrains.kotlin:*
          - org.jetbrains.kotlin.*
          # Kotlin DSL accessors are reported under these short names.
          - jvm
          - plugin.compose
          - plugin.serialization
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      codeql:
        patterns:
          - github/codeql-action/*
