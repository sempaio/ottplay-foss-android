gradle.beforeProject { p ->
    p.pluginManager.withPlugin('com.android.application') {
        p.configurations.configureEach { c ->
            if (c.name == 'paraVoceQaImplementation') c.extendsFrom(p.configurations.getByName('debugImplementation'))
        }
        p.extensions.getByName('androidComponents').finalizeDsl { dsl ->
            dsl.buildTypes.create('paraVoceQa') {
                initWith(dsl.buildTypes.getByName('paraVoceTest'))
                applicationIdSuffix = '.paravoce.qa'
                matchingFallbacks += ['paraVoceTest', 'debug']
            }
            dsl.testBuildType = 'paraVoceQa'
        }
    }
}
